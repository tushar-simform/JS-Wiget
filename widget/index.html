<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>Slotted Easy-RFP Widget Demo</title>
    <link rel="stylesheet" href="widget.css" />
  </head>
  <body>
    <!-- Demo button - React developers can add this button with the same ID -->
    <button
      id="open-slotted-widget"
      style="
        display: block;
        margin: 50px auto;
        padding: 15px 30px;
        background: #4f8cff;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        box-shadow: 0 4px 12px rgba(79, 140, 255, 0.3);
        transition: all 0.2s;
      "

      📋 Open RFP Widget
    </button>

    <div id="slotted-easyrfp" data-widget-key="abc123"></div>
